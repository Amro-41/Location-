<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Location</title>
</head>

<body>
  <h2>Shared Location</h2>
  <p id="status">Loading...</p>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAcZ7ZXY3rTkZT6jZ55Tm9qDQicMJ6E2jA",
      authDomain: "amrolocation.firebaseapp.com",
      databaseURL: "https://amrolocation-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "amrolocation",
      storageBucket: "amrolocation.firebasestorage.app",
      messagingSenderId: "157641871095",
      appId: "1:157641871095:web:4b197ee8474938c83c0df2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const locationRef = ref(db, "sharedLocation");

    onValue(locationRef, (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        document.getElementById("status").textContent =
          "No location received yet.";
        return;
      }

      const mapUrl =
        "https://www.google.com/maps?q=" +
        data.latitude + "," + data.longitude;

      document.getElementById("status").innerHTML =
        "Location received.<br><br>" +
        "<a href='" + mapUrl + "' target='_blank'>" +
        "📍 Open location in Google Maps" +
        "</a>";
    });
  </script>
</body>
</html>
